<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário · Puro Açaí</title>
<meta name="theme-color" content="#480748">
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.js"></script>
<style>
:root{--roxo:#480748;--roxo2:#6a1f6a;--fundo:#F4F0F6;--tx:#1D1622;--mut:#5E5466;--linha:#E4DCE9;--ok:#11663D;--okbg:#E5F5EC;--av:#A34E00;--avbg:#FFF2DC;--err:#A8261C;--errbg:#FDE8E6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fundo);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{background:var(--roxo);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header img{height:34px;display:block}
header .tt{flex:1;min-width:0;display:flex;flex-direction:column}
header .tt b{font-size:17px}
header .tt span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header nav{display:flex;gap:4px}
header nav button{background:transparent;border:0;color:#E9DCF0;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;min-height:40px}
header nav button.on{background:rgba(255,255,255,.2);color:#fff}
@media (max-width:560px){ header nav{order:3;width:100%} header nav button{flex:1;background:rgba(255,255,255,.08)} }
.bt-user{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;min-height:40px;cursor:pointer;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:12px 12px 60px;display:flex;flex-direction:column;gap:12px}
body.largo main{max-width:1100px}
small{color:var(--mut)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid #CFC5D6;background:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.prim{background:var(--roxo);border-color:var(--roxo);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grande{min-height:58px;font-size:18px;width:100%}
.lin-acoes{display:flex;gap:10px;flex-wrap:wrap}
.lin-acoes .btn{flex:1}
.msg{margin:0;font-weight:600}
.msg.err{color:var(--err)}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:14px;font-weight:700;color:var(--mut)}
.campo input,.campo select{height:50px;border:1px solid #CFC5D6;border-radius:12px;padding:0 12px;font-size:17px;background:#fff;width:100%}
/* login */
.login{position:fixed;inset:0;background:var(--fundo);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{background:#fff;border:1px solid var(--linha);border-radius:18px;padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login-logo{height:64px;align-self:center;background:var(--roxo);border-radius:12px;padding:8px 14px}
.login h1{margin:0;font-size:20px;text-align:center}
body.sem-login header,body.sem-login main{visibility:hidden}
.abrindo{position:fixed;inset:0;background:rgba(244,240,246,.92);z-index:70;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700}
.spin{width:22px;height:22px;border:3px solid #E0D2E8;border-top-color:var(--roxo);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* câmera (mesmo leitor da conferência) */
.mar-leitor{position:relative;border-radius:16px;overflow:hidden;background:#141016;min-height:170px}
.mar-leitor video{width:100%;height:min(36vh,280px);object-fit:cover;display:block;background:#111}
.mar-leitor .mira{position:absolute;left:6%;right:6%;top:26%;bottom:26%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.mar-leitor .mira::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.mar-leitor .lanterna{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px}
.mar-leitor .lanterna.on{background:#ffd60a;color:#000}
.mar-leitor .cam-fechar{position:absolute;left:10px;bottom:10px;border:0;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;padding:10px 14px}
.mar-cam{position:relative;width:100%;height:150px;border-radius:16px;background:#141016;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.mar-cam .mira{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.85);border-radius:10px}
.mar-cam .cam-txt{position:relative;text-align:center;font-weight:700;font-size:16px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px}
.mar-cam .cam-txt small{color:#E0D2E8}
/* retorno da última ação */
.fb{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px;font-weight:800;font-size:17px;line-height:1.25}
.fb img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.fb.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.fb.err{background:var(--errbg);color:var(--err);border:2px solid var(--err)}
.fb .btn{margin-left:auto;flex:none;min-height:40px;font-size:14px}
/* progresso, busca e filtros */
.prog{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.prog b{font-size:20px}
.barra{display:block;height:10px;background:#EEE7F2;border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--roxo2);border-radius:99px}
.busca{height:50px;border:1px solid #CFC5D6;border-radius:12px;padding:0 14px;font-size:17px;background:#fff;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid #DDD3E3;background:#fff;font-weight:700;color:#4F4556;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
/* lista de produtos */
.lista{display:flex;flex-direction:column;gap:8px}
.grupo{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:8px 2px 0}
.prod{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%}
.prod:active{background:#F6F0F9}
.prod img,.prod .semfoto{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.prod .semfoto{background:#EEE7F2}
.prod .nm{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;line-height:1.2}
.prod .nm small{font-weight:500;margin-top:3px}
.prod .st{font-size:14px;font-weight:800;text-align:right;white-space:nowrap}
.prod .st.feito{color:var(--ok)}
.prod .st.nao{color:#B4A9BB}
.bloco{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bloco summary{font-weight:800;cursor:pointer;min-height:34px;display:flex;align-items:center}
.lanc{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #F0EAF3;font-size:15px}
.lanc .h{color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.lanc .d{flex:1;min-width:0}
.lanc.est .d{text-decoration:line-through;color:var(--mut)}
.lanc .btn{min-height:38px;padding:0 10px;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:4px;vertical-align:middle}
.tag.est{background:var(--errbg);color:var(--err)}
.tag.man{background:#EEE7F2;color:#5B2475}
/* janela de contagem */
.modal{position:fixed;inset:0;background:rgba(20,8,25,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal .box{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:94vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:19px}
.cq-top{display:flex;align-items:center;gap:12px}
.cq-top img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--linha);flex:none}
.cq-top b{display:block;font-size:19px;line-height:1.2}
.cq-top small.lido{color:var(--ok);font-weight:800}
.cq-in{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.cq-in input{height:76px;border:2px solid var(--roxo);border-radius:14px;text-align:center;font-size:42px;font-weight:800;min-width:0}
.cq-in .btn{height:76px;font-size:30px;padding:0}
.cq-av{display:flex;align-items:center;gap:10px}
.cq-av input{width:110px;height:50px;border:1px solid #CFC5D6;border-radius:12px;text-align:center;font-size:22px;font-weight:700}
.cq-zero{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px}
.cq-zero input{width:24px;height:24px}
.res-big{text-align:center;padding:6px 0}
.res-big .t{font-size:15px;color:var(--mut);font-weight:700}
.res-big .v{font-size:48px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res-grid div{background:#F6F0F9;border-radius:12px;padding:10px;text-align:center}
.res-grid span{display:block;font-size:13px;color:var(--mut);font-weight:700}
.res-grid b{font-size:28px;font-variant-numeric:tabular-nums}
.res-dif{border-radius:14px;padding:14px;text-align:center;font-weight:900;font-size:22px}
.res-dif.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}
.res-dif.falta{background:var(--errbg);color:var(--err);border:2px solid var(--err)}
.res-dif.sobra{background:var(--avbg);color:var(--av);border:2px solid var(--av)}
.res-dif.sem{background:#F1EEF3;color:var(--mut);border:2px solid #DDD3E3;font-size:17px}
.res-dica{font-size:15px;color:var(--tx);background:#FBF9FC;border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
.esc-lista{border:1px solid var(--linha);border-radius:12px;max-height:46vh;overflow:auto}
.esc-lista button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid #F0EAF3;background:#fff;cursor:pointer}
.esc-lista img{width:36px;height:36px;object-fit:contain}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1622;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
/* resumo do administrador */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cardk{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.cardk span{font-size:12px;color:var(--mut);font-weight:700}
.cardk b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.cardk.f b{color:var(--err)} .cardk.s b{color:var(--av)} .cardk.o b{color:var(--ok)}
@media (max-width:640px){ .cards{grid-template-columns:repeat(2,1fr)} }
.tab-res{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linha);border-radius:12px;overflow:hidden;font-size:14px}
.tab-res th{background:#FBF9FC;color:#4F4556;text-align:left;padding:8px;font-size:12px}
.tab-res td{padding:8px;border-top:1px solid #F0EAF3;vertical-align:middle}
.tab-res td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tab-res tr.lin{cursor:pointer}
.tab-res tr.lin:hover td{background:#FAF6FC}
.tab-res tr.det td{background:#FBF9FC}
.sit{font-size:12px;font-weight:900;padding:3px 8px;border-radius:6px;white-space:nowrap}
.sit.OK{background:var(--okbg);color:var(--ok)} .sit.FALTA{background:var(--errbg);color:var(--err)} .sit.SOBRA{background:var(--avbg);color:var(--av)}
.sit.NAO{background:#F1EEF3;color:var(--mut)} .sit.SEM{background:#EEE7F2;color:#5B2475}
@media print{
  header,.nao-imp,.modal,.toast{display:none!important}
  html,body{background:#fff}
  main{max-width:none;padding:0}
  .tab-res th{position:static}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>

<script>
/* =====================================================================
   SERVIDOR · login e chamadas ao Apps Script do inventário
   ===================================================================== */
// Dentro do Apps Script a tela fala com o servidor por google.script.run (não precisa de endereço).
// API_PADRAO só é usado se esta página for aberta fora do Apps Script.
const API_PADRAO = "";
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
// código aleatório deste celular: é o que fica gravado como "quem contou" (CELULAR XXXXXX)
let DEV = LS.get('inv_dev');
if(!/^[A-Z0-9]{6}$/.test(DEV || '')){ DEV = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''); LS.set('inv_dev', DEV); }
// token só existe quando um ADMINISTRADOR entra (para ver o Resumo); a contagem não usa login
const E = { api: API_PADRAO, token: LS.get('inv_token') || '', nome: LS.get('inv_nome') || '', perfil: LS.get('inv_token') ? 'ADMIN' : '' };
const ehAdmin = () => E.perfil === 'ADMIN';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tiraAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const novoOp = () => 'O' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtN = v => v == null || v === '' ? '—' : String(Math.round(Number(v) * 100) / 100).replace('.', ',');

async function api(acao, dados, comoAdmin){
  let r;
  const corpo = Object.assign({ acao, dev: DEV }, comoAdmin && E.token ? { token: E.token } : {}, dados || {});
  let j;
  if(window.google && google.script && google.script.run){
    // dentro do Apps Script
    try{
      j = JSON.parse(await new Promise((ok, falha) => google.script.run.withSuccessHandler(ok).withFailureHandler(falha).rpc(JSON.stringify(corpo))));
    }catch(e){ const er = new Error('Sem conexão com o servidor (' + ((e && e.message) || e) + '). Verifique a internet e toque de novo (não duplica).'); er.rede = true; throw er; }
  } else {
    try{
      r = await fetch(E.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) });
    }catch(e){ const er = new Error('Sem conexão com o servidor. Verifique a internet e toque de novo (não duplica).'); er.rede = true; throw er; }
    try{ j = await r.json(); }
    catch(e){ const er = new Error('Resposta inesperada do servidor.'); er.rede = true; throw er; }
  }
  if(!j.ok){
    if(j.sessao) sairAdmin('O acesso de administrador expirou. Entre de novo.');
    const er = new Error(j.erro || 'Erro no servidor.'); er.sessao = j.sessao; throw er;
  }
  return j;
}

/* =====================================================================
   LEITOR DE CÓDIGO DE BARRAS (o mesmo da conferência de saída)
   ===================================================================== */
const AUSENTE_MS = 350, MIN_REPETIR_MS = 900, PAUSA_OK = 300, PAUSA_ERRO = 1200;
const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'code_128'];
function gtinOk(s){
  if(!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(s)) return false;
  const d = s.split('').map(Number); const chk = d.pop(); let soma = 0;
  d.reverse().forEach((v, i) => { soma += v * (i % 2 === 0 ? 3 : 1); });
  return (10 - soma % 10) % 10 === chk;
}
let detectorP = null;
function obterDetector(){
  if(detectorP) return detectorP;
  detectorP = (async () => {
    if('BarcodeDetector' in window){
      try{
        const sup = await window.BarcodeDetector.getSupportedFormats();
        const f = FORMATOS.filter(x => sup.includes(x));
        if(f.includes('ean_13')){
          const det = new window.BarcodeDetector({ formats: f });
          const c = document.createElement('canvas'); c.width = c.height = 32;
          await det.detect(c);
          return { det, nativo: true };
        }
      }catch(e){}
    }
    return detectorZXing();
  })();
  detectorP.catch(() => { detectorP = null; });
  return detectorP;
}
function detectorZXing(){
  const A = window.BarcodeDetectionAPI;
  if(!A) throw new Error('O leitor de código não carregou. Verifique a internet e recarregue a página.');
  return { det: new A.BarcodeDetector({ formats: FORMATOS }), nativo: false };
}
function trocarParaZXing(){ const d = detectorZXing(); detectorP = Promise.resolve(d); aquecer_(d.det); return d; }
function aquecer_(det){ const c = document.createElement('canvas'); c.width = c.height = 32; det.detect(c).catch(() => {}); }
function aquecerLeitor(){ obterDetector().then(({ det, nativo }) => { if(!nativo) aquecer_(det); }).catch(() => {}); }
function melhorCodigo(res){
  for(const r of res || []){
    const v = String(r.rawValue || '').trim();
    if(!v) continue;
    if(/^\d+$/.test(v) && v.length >= 8 && v.length <= 14 && !gtinOk(v)) continue;
    return v;
  }
  return '';
}
class Leitor{
  constructor(box){ this.box = box; this.ativo = false; this.pausado = false; this.cb = null; this.ult = { c: '', t: 0 }; this.vistoEm = 0; }
  async iniciar(cb){
    this.cb = cb; if(this.ativo) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Este navegador não libera a câmera. Use o Chrome (Android) ou o Safari (iPhone).');
    const d = await obterDetector();
    this.det = d.det; this.nativo = d.nativo; this.falhas = 0;
    this.box.innerHTML = '<video playsinline muted autoplay></video><div class="mira"></div><button type="button" class="lanterna" hidden aria-label="Lanterna">🔦</button><button type="button" class="cam-fechar" data-m="camFechar">Fechar câmera</button>';
    this.video = this.box.querySelector('video');
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } } });
    this.video.srcObject = this.stream;
    await this.video.play();
    this.track = this.stream.getVideoTracks()[0];
    this._ajustar();
    this.canvas = document.createElement('canvas');
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.ativo = true; this.pausado = false;
    this._loop();
  }
  async _ajustar(){
    try{
      const caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
      if(caps.focusMode && caps.focusMode.includes('continuous')) await this.track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      if(caps.torch){
        const b = this.box.querySelector('.lanterna'); b.hidden = false; let on = false;
        b.onclick = async ev => { ev.stopPropagation(); on = !on; try{ await this.track.applyConstraints({ advanced: [{ torch: on }] }); b.classList.toggle('on', on); }catch(e){} };
      }
    }catch(e){}
  }
  async _loop(){
    while(this.ativo){
      const v = this.video;
      // segurança: se a leitura ficou pausada sem nenhuma janela aberta, volta a ler sozinha
      if(this.pausado && this.pausadoEm && Date.now() - this.pausadoEm > 2500 && document.getElementById('modal').hidden) this.pausado = false;
      if(v && v.readyState >= 2 && v.videoWidth && !this.pausado){
        const vw = v.videoWidth, vh = v.videoHeight;
        const cw = Math.round(vw * 0.9), ch = Math.round(Math.min(vh * 0.5, cw * 0.6));
        const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
        const k = Math.min(1, 1280 / cw), w = Math.round(cw * k), hh = Math.round(ch * k);
        if(this.canvas.width !== w) this.canvas.width = w;
        if(this.canvas.height !== hh) this.canvas.height = hh;
        this.ctx.drawImage(v, sx, sy, cw, ch, 0, 0, w, hh);
        let res = [];
        try{ res = await this.det.detect(this.canvas); this.falhas = 0; }
        catch(e){ if(this.nativo && ++this.falhas >= 2){ const z = trocarParaZXing(); this.det = z.det; this.nativo = false; } }
        if(!this.ativo) break;
        const cod = melhorCodigo(res);
        if(cod) this._visto(cod, Date.now());
      }
      if(v && v.paused && this.ativo){ try{ v.play(); }catch(e){} }
      await new Promise(r => requestAnimationFrame(() => r()));
    }
  }
  _visto(t, agora){
    const mesmo = t === this.ult.c, sumiuHa = agora - this.vistoEm;
    if(mesmo) this.vistoEm = agora;
    if(this.pausado || !this.cb) return;
    if(mesmo && (agora - this.ult.t < MIN_REPETIR_MS || sumiuHa < AUSENTE_MS)) return;
    this.ult = { c: t, t: agora }; this.vistoEm = agora; this.pausado = true; this.pausadoEm = agora;
    this.cb(t);
  }
  liberar(ms){ const t = this.pausadoEm; setTimeout(() => { if(this.pausadoEm === t) this.pausado = false; }, ms == null ? PAUSA_OK : ms); }
  parar(){
    this.ativo = false; this.pausado = false; this.cb = null;
    try{ if(this.stream) this.stream.getTracks().forEach(t => t.stop()); }catch(e){}
    this.stream = null; this.track = null; this.box.innerHTML = '';
  }
}

let bipAudio = null;
function bip(ok){
  try{
    bipAudio = bipAudio || new (window.AudioContext || window.webkitAudioContext)();
    if(bipAudio.state === 'suspended') bipAudio.resume();
    let t = bipAudio.currentTime;
    (ok ? [[1046, .12]] : [[220, .22], [160, .32]]).forEach(([f, d]) => {
      const o = bipAudio.createOscillator(), g = bipAudio.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f; g.gain.value = .2;
      o.connect(g); g.connect(bipAudio.destination); o.start(t); o.stop(t + d); t += d + .05;
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok ? 80 : [250, 100, 250]); }catch(e){}
}

const inpFoto = document.createElement('input');

    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
    const { det } = await obterDetector();
    let cod = melhorCodigo(await det.detect(c));
    if(!cod && window.BarcodeDetectionAPI){ cod = melhorCodigo(await new window.BarcodeDetectionAPI.BarcodeDetector({ formats: FORMATOS }).detect(c)); }
    if(!cod){ bip(false); toast('Não consegui ler o código. Tire a foto mais perto, com a etiqueta reta e bem iluminada.'); return; }

function montaCamera(){

function lido(cod){
  cod = codigoCadastrado(cod);

  if(!k || !prodDe(k)){
    S.fb = { ok: false, msg: 'Código ' + cod + ' não está cadastrado. Escolha o produto na lista ou cadastre o código.', cod };
    bip(false); renderContar(true); leitor.liberar(PAUSA_ERRO); return;
  }
  bip(true); abreContagem(k, cod);
}

function abreContagem(k, cod){
  const p = prodDe(k); if(!p){ leitor.liberar(); return; }
  const opId = novoOp();
  modal(`<div class="cq-top">${FOTOS[k] ? `<img src="${FOTOS[k]}" alt="">` : ''}<div><b>${esc(p.n)}</b>${cod ? '<small class="lido">Código lido ✓</small>' : '<small>Escolhido na lista' + (p.prd ? ' · ' + esc(p.prd) : '') + '</small>'}</div></div>
    <label for="cQ" style="font-weight:800">${p.un === 'BD' ? 'Quantos baldes' : 'Quantas caixas'} você contou?</label>
    <div class="cq-in"><button type="button" class="btn" id="cMenos" aria-label="Menos 1">−</button><input id="cQ" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="5"><button type="button" class="btn" id="cMais" aria-label="Mais 1">+</button></div>
    <div class="cq-av"><label for="cAv" style="flex:1;font-weight:700">Unidades soltas (fora da caixa)<br><small>Deixe vazio se não tiver</small></label><input id="cAv" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="5"></div>
    <label class="cq-zero"><input type="checkbox" id="cZero"> Não tem nenhum deste produto (contagem zero)</label>
    <p class="msg err" id="cMsg"></p>
    <div class="lin-acoes"><button type="button" class="btn" id="cCanc">Cancelar</button><button type="button" class="btn ok" id="cOk" style="min-height:56px;font-size:18px">Gravar contagem</button></div>`);
  const inp = $('#cQ'), av = $('#cAv');
  setTimeout(() => { try{ inp.focus(); }catch(_){} }, 60);
  const val = el => parseInt(String(el.value).replace(/\D/g, ''), 10) || 0;
  $('#cMenos').onclick = () => { inp.value = Math.max(0, val(inp) - 1); };
  $('#cMais').onclick = () => { inp.value = val(inp) + 1; $('#cZero').checked = false; };
  $('#cZero').onchange = () => { if($('#cZero').checked){ inp.value = ''; av.value = ''; } };
  $('#cCanc').onclick = () => { fechar(); leitor.liberar(); };
  const gravar = async () => {
    const q = val(inp), a = val(av), zero = $('#cZero').checked;
    if(!q && !a && !zero){ $('#cMsg').textContent = 'Digite quantos contou. Se não tem nenhum, marque a opção acima.'; return; }
    if((q || a) && zero){ $('#cMsg').textContent = 'Desmarque "não tem nenhum" ou apague a quantidade.'; return; }
    const bt = $('#cOk'); bt.disabled = true; bt.textContent = 'Gravando…'; $('#cMsg').textContent = '';
    try{
      const r = await api('contar', { k, q, av: a, zero, modo: cod ? 'LEITURA' : 'MANUAL', codigo: cod, opId });
      S.contados[k] = { q: r.total.q, av: r.total.av, n: r.total.n };
      if(!S.meus.some(x => x.id === r.lanc.id)) S.meus.push(r.lanc);
      S.fb = { ok: true, k, msg: p.n + ': ' + fmtN(q) + ' ' + unid(p) + (a ? ' + ' + a + ' und' : '') + ' gravado.' };
      bip(true); mostraResultado(r, p);
    }catch(er){
      if(!$('#cOk')) return;
      bt.disabled = false; bt.textContent = 'Gravar contagem'; $('#cMsg').textContent = er.message; bip(false);
    }
  };
  $('#cOk').onclick = gravar;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') gravar(); });
  av.addEventListener('keydown', e => { if(e.key === 'Enter') gravar(); });
}
function mostraResultado(r, p){
  const esp = r.esperado, dif = r.diferenca, t = r.total;
  let cls = 'sem', txt = 'Sem saldo esperado cadastrado para este produto.';
  if(dif != null){
    if(Math.abs(dif) < 1e-9){ cls = 'ok'; txt = '✓ Bate com o esperado'; }
    else if(dif < 0){ cls = 'falta'; txt = 'Faltam ' + fmtN(-dif) + ' ' + unid(p); }
    else { cls = 'sobra'; txt = 'Sobram ' + fmtN(dif) + ' ' + unid(p); }
  }
  const por = Object.entries(t.por || {}).map(([n, v]) => esc(n) + ': ' + fmtN(v)).join(' · ');
  modal(`<div class="cq-top">${FOTOS[p.k] ? `<img src="${FOTOS[p.k]}" alt="">` : ''}<div><b>${esc(p.n)}</b><small class="lido">Contagem gravada ✓ ${esc(r.lanc.hora)}</small></div></div>
    <div class="res-big"><div class="t">Você contou</div><div class="v">${fmtN(r.lanc.q)}</div><div class="t">${unid(p)}${r.lanc.av ? ' + ' + r.lanc.av + ' unidades soltas' : ''}</div></div>
    <div class="res-grid"><div><span>Total contado do produto</span><b>${fmtN(t.q)}</b>${t.av ? `<small>+ ${t.av} und</small>` : ''}</div><div><span>Esperado no sistema</span><b>${esp == null ? '—' : fmtN(esp)}</b></div></div>
    ${t.n > 1 ? `<small style="text-align:center">${t.n} lançamentos somados (${por})</small>` : ''}
    <div class="res-dif ${cls}">${txt}</div>
    ${cls === 'falta' || cls === 'sobra' ? `<div class="res-dica">Antes de seguir, <b>confira de novo</b>. Se achou mais deste produto em outro lugar, conte e lance de novo: os lançamentos <b>somam</b>. Se digitou errado, toque em <b>Estornar</b> e lance de novo.</div>` : ''}
    <div class="lin-acoes"><button type="button" class="btn" id="rEst">Estornar</button><button type="button" class="btn prim" id="rOk" style="min-height:56px;font-size:18px">Próximo produto</button></div>`);
  $('#rOk').onclick = () => { fechar(); renderContar(true); leitor.liberar(); };
  $('#rEst').onclick = () => pedeEstorno(S.meus.find(x => x.id === r.lanc.id));
  setTimeout(() => { try{ $('#rOk').focus(); }catch(_){} }, 60);
}

/* ---------- estorno (ADMIN direto; contador precisa do PIN de um ADMIN) ---------- */
function pedeEstorno(x){
  if(!x) return;
  const p = prodDe(x.k);
  modal(`<h3>Estornar lançamento</h3>
    <p style="margin:0"><b>${esc(p ? p.n : x.k)}</b><br>${fmtN(x.q)} ${esc(unid(p))}${x.av ? ' + ' + x.av + ' und' : ''} · ${esc(x.usu)} · ${esc(x.hora)}</p>
    <div class="campo"><label for="eMot">Motivo *</label><input id="eMot" maxlength="200" placeholder="Ex.: digitei errado / contado duas vezes"></div>
    ${ehAdmin() ? '' : `<div class="campo"><label for="eAdm">Administrador</label><select id="eAdm"><option value="">Selecione…</option>${S.admins.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
    <div class="campo"><label for="ePin">PIN do administrador</label><input id="ePin" type="password" inputmode="numeric" autocomplete="off"></div>`}
    <p class="msg err" id="eMsg"></p>
    <div class="lin-acoes"><button type="button" class="btn" id="eVoltar">Voltar</button><button type="button" class="btn prim" id="eOk">Estornar</button></div>`);
  $('#eVoltar').onclick = () => { fechar(); renderTela(); leitor.liberar(); };
  $('#eOk').onclick = async () => {
    const mot = $('#eMot').value.trim();
    if(!mot){ $('#eMsg').textContent = 'Informe o motivo.'; return; }
    const adm = ehAdmin() ? null : { nome: $('#eAdm').value, pin: $('#ePin').value };
    if(adm && (!adm.nome || !adm.pin)){ $('#eMsg').textContent = 'Escolha o administrador e digite o PIN.'; return; }
    const bt = $('#eOk'); bt.disabled = true; $('#eMsg').textContent = 'Estornando…';
    try{
      const r = await api('estornar', { id: x.id, motivo: mot, adm }, true);
      x.sit = 'ESTORNADO'; x.epor = ehAdmin() ? E.nome : adm.nome; x.mot = mot;
      if(r.total.n) S.contados[r.k] = r.total; else delete S.contados[r.k];
      S.fb = { ok: true, k: x.k, msg: 'Lançamento estornado. Conte de novo se precisar.' };
      fechar(); toast('Estornado.'); renderTela(); leitor.liberar();
      if(S.view === 'resumo') carregaResumo();
    }catch(er){ bt.disabled = false; $('#eMsg').textContent = er.message; }
  };
}

/* ---------- cadastrar código de barras novo ---------- */
function cadastraCodigo(cod){
  let sel = '';
  const lista = () => { const q = tiraAc($('#ccBusca').value); $('#ccLista').innerHTML = S.prods.filter(p => !q || tiraAc(p.n).includes(q)).map(p => `<button type="button" data-ck="${p.k}" style="${sel === p.k ? 'background:#EEE7F2;font-weight:800' : ''}">${FOTOS[p.k] ? `<img src="${FOTOS[p.k]}" alt="">` : ''}<span>${esc(p.n)}</span></button>`).join(''); };
  modal(`<h3>Cadastrar código ${esc(cod)}</h3><small>Escolha de qual produto é esta etiqueta. Fica gravado para todos os aparelhos.</small>
    <input type="search" id="ccBusca" class="busca" placeholder="Buscar produto">
    <div class="esc-lista" id="ccLista"></div>
    ${ehAdmin() ? '' : `<div class="campo"><label for="ccAdm">Administrador</label><select id="ccAdm"><option value="">Selecione…</option>${S.admins.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
    <div class="campo"><label for="ccPin">PIN do administrador</label><input id="ccPin" type="password" inputmode="numeric" autocomplete="off"></div>`}
    <p class="msg err" id="ccMsg"></p>
    <div class="lin-acoes"><button type="button" class="btn" id="ccVoltar">Voltar</button><button type="button" class="btn prim" id="ccOk">Cadastrar</button></div>`);
  lista();
  $('#ccBusca').oninput = lista;
  $('#ccLista').onclick = e => { const b = e.target.closest('[data-ck]'); if(b){ sel = b.dataset.ck; lista(); } };
  $('#ccVoltar').onclick = () => { fechar(); leitor.liberar(); };
  $('#ccOk').onclick = async () => {
    if(!sel){ $('#ccMsg').textContent = 'Escolha o produto.'; return; }
    const adm = ehAdmin() ? null : { nome: $('#ccAdm').value, pin: $('#ccPin').value };
    if(adm && (!adm.nome || !adm.pin)){ $('#ccMsg').textContent = 'Escolha o administrador e digite o PIN.'; return; }
    $('#ccOk').disabled = true; $('#ccMsg').textContent = 'Cadastrando…';
    try{
      const r = await api('codigo', { codigo: cod, k: sel, adm }, true);
      S.codigos = r.codigos; S.fb = null; fechar(); toast('Código cadastrado.'); abreContagem(sel, cod);
    }catch(er){ $('#ccOk').disabled = false; $('#ccMsg').textContent = er.message; }
  };
}

/* =====================================================================
   TELA: RESUMO (só ADMIN) · esperado × contado × diferença
   ===================================================================== */
const situacao = l => l.q == null ? 'NAO' : l.esp == null ? 'SEM' : Math.abs(l.dif) < 1e-9 ? 'OK' : l.dif < 0 ? 'FALTA' : 'SOBRA';
const SIT_TXT = { NAO: 'NÃO CONTADO', SEM: 'SEM ESPERADO', OK: 'OK', FALTA: 'FALTA', SOBRA: 'SOBRA' };
async function carregaResumo(){
  $('#v-resumo').innerHTML = S.res ? $('#v-resumo').innerHTML : '<div class="bloco" style="flex-direction:row;align-items:center;gap:10px"><div class="spin"></div>Carregando…</div>';
  try{ S.res = await api('resumo', {}, true); renderResumo(); }
  catch(e){ if(!e.sessao) $('#v-resumo').innerHTML = `<div class="fb err">${esc(e.message)}</div>`; }
}
function renderResumo(){
  const R = S.res; if(!R) return;
  const L = R.linhas.map(l => Object.assign({ sit: situacao(l) }, l));
  const n = s => L.filter(l => l.sit === s).length;
  const vis = L.filter(l => S.resFiltro === 'Todos' || (S.resFiltro === 'Divergentes' ? (l.sit === 'FALTA' || l.sit === 'SOBRA') : S.resFiltro === 'Não contados' ? l.sit === 'NAO' : true));
  const lancDe = k => R.lancs.filter(x => x.k === k);
  $('#v-resumo').innerHTML = `
    <div class="lin-acoes nao-imp" style="align-items:center"><small style="flex:2">Atualizado às ${esc(R.hora.slice(11, 16))} · a aba <b>Resumo</b> da planilha mostra o mesmo.</small>
      <button type="button" class="btn" data-r="atualizar">Atualizar</button><button type="button" class="btn" data-r="imprimir">Imprimir</button></div>
    <h2 style="margin:4px 0 0;font-size:20px">Inventário ${esc(S.hoje)}</h2>
    <div class="cards">
      <div class="cardk"><span>Contados</span><b>${L.length - n('NAO')}/${L.length}</b></div>
      <div class="cardk o"><span>Batem</span><b>${n('OK')}</b></div>
      <div class="cardk f"><span>Com falta</span><b>${n('FALTA')}</b></div>
      <div class="cardk s"><span>Com sobra</span><b>${n('SOBRA')}</b></div>
      <div class="cardk"><span>Sem esperado</span><b>${n('SEM')}</b></div>
    </div>
    <div class="chips nao-imp">${['Todos', 'Divergentes', 'Não contados'].map(f => `<button type="button" data-rf="${f}" class="${S.resFiltro === f ? 'on' : ''}">${f}</button>`).join('')}</div>
    <table class="tab-res"><thead><tr><th>Produto</th><th>Un</th><th style="text-align:right">Esperado</th><th style="text-align:right">Contado</th><th style="text-align:right">Diferença</th><th>Situação</th><th style="text-align:right">Lanç.</th></tr></thead><tbody>
    ${vis.map(l => `<tr class="lin" data-rk="${l.k}"><td><b>${esc(l.n)}</b><br><small>${esc(l.prd || '')}</small></td><td>${esc(l.un)}</td>
      <td class="n">${fmtN(l.esp)}</td><td class="n">${l.q == null ? '—' : fmtN(l.q)}${l.av ? `<br><small>+${l.av} und</small>` : ''}</td>
      <td class="n" style="color:${l.dif < 0 ? 'var(--err)' : l.dif > 0 ? 'var(--av)' : 'inherit'}">${l.dif == null ? '—' : (l.dif > 0 ? '+' : '') + fmtN(l.dif)}</td>
      <td><span class="sit ${l.sit}">${SIT_TXT[l.sit]}</span></td><td class="n">${l.nl || ''}</td></tr>
      ${S.resAberto === l.k ? `<tr class="det"><td colspan="7">${lancDe(l.k).length ? lancDe(l.k).slice().reverse().map(x => linhaLanc(x, false)).join('') : '<small>Nenhum lançamento.</small>'}</td></tr>` : ''}`).join('')}
    </tbody></table>`;
}
$('#v-resumo').addEventListener('click', e => {
  const t = e.target.closest('[data-r],[data-rf],[data-est],[data-rk]');
  if(!t) return;
  if(t.dataset.est){ pedeEstorno(S.res.lancs.find(x => x.id === t.dataset.est)); return; }
  if(t.dataset.r === 'atualizar') carregaResumo();
  if(t.dataset.r === 'imprimir') window.print();
  if(t.dataset.rf){ S.resFiltro = t.dataset.rf; renderResumo(); }
  if(t.dataset.rk){ S.resAberto = S.resAberto === t.dataset.rk ? null : t.dataset.rk; renderResumo(); }
});

function irPara(v){
  S.view = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#v-contar').hidden = v !== 'contar'; $('#v-resumo').hidden = v !== 'resumo';
  document.body.classList.toggle('largo', v === 'resumo');
  if(v === 'resumo' && !ehAdmin()){ S.view = 'contar'; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === 'contar')); $('#v-contar').hidden = false; $('#v-resumo').hidden = true; document.body.classList.remove('largo'); entraAdmin(() => irPara('resumo')); return; }
  if(v === 'contar') renderContar(); else { if(leitor.ativo) leitor.parar(); carregaResumo(); }
  window.scrollTo(0, 0);
}
function renderTela(){ if(S.view === 'contar') renderContar(true); else renderResumo(); }
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if(b) irPara(b.dataset.v); });
$('#btUser').onclick = () => {

    ${ehAdmin() ? '<button type="button" class="btn grande" id="uSair" style="color:var(--err)">Sair do modo administrador</button>' : '<button type="button" class="btn grande" id="uAdm">Entrar como administrador</button>'}
    <button type="button" class="btn" id="uFechar">Fechar</button>`);

  if($('#uSair')) $('#uSair').onclick = () => { fechar(); sairAdmin('Saiu do modo administrador.'); };
  if($('#uAdm')) $('#uAdm').onclick = () => entraAdmin(() => toast('Modo administrador.'));

};
